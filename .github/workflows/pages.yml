---
# Publishes design.tbhb.dev. Every pull request builds the site, so a
# change that breaks the build fails before it merges; a push to main also
# deploys the build to GitHub Pages. Bazel assembles the artifact
# (//pages), so the published site is exactly what `bazel build //pages`
# writes.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_LOCKED: "1"

# One deploy at a time, and a newer push to main never waits behind an
# older one; pull requests cancel their own stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bazel for CI
        uses: tbhb-dev/rules/.github/actions/setup-bazel-ci@c90ce38c84b6a00fa0f61888799499f32f22f9d4  # main
        with:
          disk-cache: ${{ github.workflow }}-ubuntu-26.04
          cache-save: ${{ github.event_name != 'pull_request' }}

      # --config=ci downloads no outputs, so a cache hit would leave
      # .bazel-bin/pages/pages empty; fetch the top-level outputs instead, and
      # refuse to upload an artifact without the site's index page.
      - name: Build the site
        run: bazelisk build --config=ci --remote_download_outputs=toplevel //pages

      - name: Check the artifact
        run: test -f .bazel-bin/pages/pages/index.html

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: .bazel-bin/pages/pages

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write  # deploy-pages publishes the artifact to Pages
      id-token: write  # deploy-pages proves the run's identity with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

      # cspell:words pipefail mktemp esac vite
      - name: Check the live site
        shell: bash
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          # Keep these path boundaries and fragments in sync with path-policy.mjs.
          pattern="(^|[\"'[:space:](=:])(/tmp/|/home/|/Users/|/private/var/|execroot/|bazel-out/|_bazel_|/storybook-[A-Za-z0-9]{6}/)"
          check_url() {
            local url=$1 expected=$2 status attempt
            for attempt in 1 2 3 4; do
              if ! status=$(curl --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                --retry 3 --retry-all-errors --retry-delay 2 \
                --output "$body" --write-out '%{http_code}' "$url"); then
                continue
              fi
              if [[ "$status" != "$expected" ]]; then
                echo "$url: expected $expected, got $status (attempt $attempt)" >&2
                continue
              fi
              if [[ "$expected" == 200 ]]; then
                if LC_ALL=C grep -aEq -- "$pattern" "$body"; then
                  echo "$url: build path matched $pattern" >&2
                  LC_ALL=C grep -aEno -- ".{0,30}${pattern}.{0,30}" "$body" >&2
                  return 1
                else
                  case $? in
                    1) ;;
                    *) return 1 ;;
                  esac
                fi
              fi
              echo "$url: $status"
              return 0
            done
            echo "$url: fetch failed after four attempts" >&2
            return 1
          }
          for framework in astro html react web-components; do
            for file in iframe.html index.json index.html; do
              check_url "${PAGE_URL%/}/storybook/$framework/$file" 200
            done
            check_url "${PAGE_URL%/}/storybook/$framework/.vite/manifest.json" 404
          done
